server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: solwio-payment-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_gateway}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:simple}
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  retry:
    instances:
      solwioGateway:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      solwioGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

payment:
  gateway:
    mode: ${PAYMENT_GATEWAY_MODE:UAT}
    mid: ${PAYMENT_GATEWAY_MID:DEMO_MERCHANT_001}
    encryption-key: ${PAYMENT_GATEWAY_ENC_KEY:0123456789abcdef0123456789abcdef}
    uat-url: ${PAYMENT_GATEWAY_UAT_URL:https://uat-provider.example.com/paymentrequest/seamless}
    production-url: ${PAYMENT_GATEWAY_PROD_URL:https://provider.example.com/paymentrequest/seamless}
    callback-url: ${MERCHANT_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
    connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:15000}
    callback-replay-window-minutes: ${CALLBACK_REPLAY_WINDOW_MINUTES:5}
    stale-payment-minutes: ${STALE_PAYMENT_MINUTES:15}
    reconciliation-cron: ${RECONCILIATION_CRON:0 */10 * * * *}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
